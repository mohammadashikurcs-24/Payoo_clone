<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo | Add Money</title>
    <link rel="shortcut icon" href="/assets/logo.png" type="" />

    <!-- tailwind + daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- theme cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />

    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>

  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header
      class="border-b-1 border-neutral/10 bg-base-200 mx-auto sticky top-0 bg-base-200 z-10"
    >
      <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
        <div class="Left flex gap-2.5">
          <div>
            <img src="./assets/logo.png" alt="" class="logo w-[60px]" />
          </div>
          <div class="balance-info">
            <h2 class="text-2xl font-bold">
              $ <span id="balance">45000</span>
            </h2>
            <p class="text-neutral/50">Available Balance</p>
          </div>
        </div>

        <div class="Right aura">
          <button id="log-out" class="btn btn-soft">
            <i
              class="fa-light fa-arrow-right-from-bracket fa-flip-horizontal"
            ></i
            >Log Out
          </button>
        </div>
      </section>
    </header>

    <section class="w-11/12 mx-auto mt-8 space-y-5">
      <h2 class="font-bold text-3xl">
        Welcome to Pay<span class="text-primary">oo</span>
      </h2>
      <p class="text-neutral/50">
        Enjoy easy and convenient financial services with us. Cashout charge is
        low and
      </p>

      <div class="buttons grid grid-cols-3 gap-4 mt-6">
        <button
          class="btn flex-col h-full btn-primary  rounded-md py-4"
        >
          <img src="/assets/opt-1.png" alt="" />Add Money
        </button>
        <button
          class="btn flex-col h-full btn-primary btn-soft rounded-md py-4"
        >
          <img src="/assets/opt-2.png" alt="" />Cashout
        </button>
        <button
          class="btn flex-col h-full btn-primary btn-soft rounded-md py-4"
        >
          <img src="/assets/opt-3.png" alt="" />Send Money
        </button>
        <button
          class="btn flex-col h-full btn-primary btn-soft rounded-md py-4"
        >
          <img src="/assets/opt-4.png" alt="" />Get Bonus
        </button>
        <button
          class="btn flex-col h-full btn-primary btn-soft rounded-md py-4"
        >
          <img src="/assets/opt-5.png" alt="" />Pay Bill
        </button>
        <button
          class="btn flex-col h-full btn-primary btn-soft rounded-md py-4">
          <img src="/assets/opt-6.png" alt="" />Transactions
        </button>
      </div>
    </section>

    <section class="add-money w-11/12 mx-auto py-8">
      <h1 class="mb-5 text-2xl font-bold">Cashout</h1>

      <div class="card bg-base-100 w-full shadow rounded-3xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-lg font-medium text-base-500">Agent Number</label>
            <input
              id="agent-number"
              maxlength="11"
              minlength="11"
              type="text"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 11 digit number"
              value=""
              required/>
            <br/>

            <label class="label text-lg font-medium text-base-500">Account Number</label>
            <input
              id="cashout-amount"
              maxlength="6"
              minlength="3"
              type="number"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 11 digit account number"
              required
            />

            <br/>

            <label class="label  text-lg font-medium text-base-500">Amount to Add</label>
            <input
              id="cashout-pin"
              maxlength="4"
              minlength="4"
              type="password"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Add Amount to withdraw"
              required/>

              <br>

            <label class="label  text-lg font-medium text-base-500">Pin Number</label>
            <input
              id="cashout-pin"
              maxlength="4"
              minlength="4"
              type="password"
              class="input rounded-full bg-base-200 w-full"
              placeholder="Enter 4 Digit Pin"
              required/>








            <button
              id="btn-cashout"
              class="btn btn-neutral mt-4 rounded-4xl bg-primary font-semibold">
              Add Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <script src="/script/machines.js"></script>
  </body>
</html>
