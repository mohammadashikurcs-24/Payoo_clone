<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Log In</title>
    <link rel="shortcut icon" href="/assets/logo.png" type="">

    <!-- tailwind + daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- font awesome -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

 <!-- font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

<style>
    *{
        font-family: "Outfit", sans-serif;
    }
</style>


</head>




<body class="min-h-screen max-w-md bg-base-200 mx-auto">

   

        <div class="logo w-52 mx-auto pt-56">
            <img src="./assets/Logo-full.png" alt="">
            
        </div>
        <div class="form pt-9">
            <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-3xl ">
                <div class="card-body">
                    <fieldset class="fieldset">

                        <label class="label text-lg font-medium text-base-500">Mobile Number</label>
                        <input  id="input-number" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200" placeholder="Enter your number" value="" />
          <br>

          
          <label  class="label text-lg font-medium text-base-500">4 Digit Pin</label>
          <input id="input-pin" maxlength="4" minlength="4" type="password" class="input rounded-full bg-base-200" placeholder="Enter 4 Digit Pin" />
          
          

          <button id="btn-login" class="btn btn-neutral mt-4 rounded-4xl bg-primary  font-semibold">Login</button>
        </fieldset>
      </div>
    </div>
</div>




    <script src="/script/login.js"></script>
</body>
</html>
